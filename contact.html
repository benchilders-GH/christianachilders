  <div class="half panel panel-cyan contact">
    <h1>Have a question for Christiana?</h1>
    <p>Just fill in the information below and I will get right back to you!</p>
    <form id="contact-form" class="contact-form" action="https://formsubmit.co/christiana@christianachilders.com" method="POST">
      <input type="hidden" name="_subject" value="New message from christianachilders.com">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <p class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label></p>
      <div class="field">
        <label for="f-interest">What type of photography are you interested in?</label>
        <select id="f-interest" name="interest">
          <option value="">Select the type of session</option>
          <option>High School Senior Session</option>
          <option>Professional Headshots</option>
          <option>Family Session</option>
          <option>Newborn Session</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="field">
        <label for="f-name">Name <span class="req">(required)</span></label>
        <input id="f-name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="f-email">Email <span class="req">(required)</span></label>
        <input id="f-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="f-message">How can I help? <span class="req">(required)</span></label>
        <textarea id="f-message" name="message" rows="6" required></textarea>
      </div>
      <p class="btn-wrap"><button class="btn btn-white" type="submit">Submit</button></p>
    </form>
    <p id="form-status" class="form-status" role="status" aria-live="polite" hidden></p>
  </div>
</section>

<script>
/* Sends the form without leaving the page. If the background request fails to run at all,
   it falls back to a normal form submit so the message still goes through. */
(function () {
  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');
  if (!form || !window.fetch) return;
  function show(msg, isError) {
    status.textContent = msg; status.hidden = false;
    status.className = 'form-status' + (isError ? ' error' : '');
    status.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!form.reportValidity()) return;
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Sending\u2026'; status.hidden = true;
    fetch(form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
      method: 'POST', headers: { 'Accept': 'application/json' }, body: new FormData(form)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; });
    }).then(function (res) {
      if (res.ok && String(res.data.success) === 'true') {
        form.hidden = true;
        show('Thanks for contacting Christiana Childers Photography! We will be in touch with you shortly.', false);
      } else {
        btn.disabled = false; btn.textContent = 'Submit';
        show('Sorry, your message could not be sent. Please try again, or email christiana@christianachilders.com directly.', true);
      }
    }).catch(function () { form.submit(); });
  });
})();
</script>
